# Play current (most recently played) Audible audiobook
# =====================================================
#
# A Home Assistant `rest_command` + `script` pair that resumes the Audible
# audiobook you last listened to, on a Music Assistant speaker you choose
# when running the script.
#
# How it works
# ------------
# The `rest_command` calls Music Assistant's JSON-RPC HTTP endpoint
# (`POST /api`) and asks for the 50 most recently played audiobooks in the
# library. The `script` then picks the first one whose provider mappings
# include an `audible` mapping and hands its `library://audiobook/<id>` URI
# to the `music_assistant.play_media` service. MA resumes from the saved
# position automatically.
#
# We can't ask MA to filter by the `audible` *domain* server-side because
# `library_items` only filters by provider *instance id* (e.g.
# `audible--ab12cd34`). Filtering client-side here avoids requiring the
# user to look up the instance id.
#
# Setup
# -----
# 1. In Music Assistant, sign in as your user and create a long-lived API
#    token (Settings -> Users -> <you> -> API tokens).
# 2. Add to Home Assistant's `secrets.yaml`:
#
#        music_assistant_url: "http://homeassistant.local:8095"
#        music_assistant_auth: "Bearer <paste the long-lived token here>"
#
#    Use the URL/port of your MA server. If MA runs as a HA add-on the
#    URL is typically `http://<ha-host>:8095`.
# 3. Merge the `rest_command:` block into `configuration.yaml`.
# 4. Merge the `script:` block into `scripts.yaml` (or under a `script:`
#    key in `configuration.yaml`).
# 5. Reload `rest_command` and `script` from Developer Tools, or restart
#    Home Assistant.
# 6. Call `script.play_recent_audible_audiobook` with the target speaker:
#
#        action: script.play_recent_audible_audiobook
#        data:
#          media_player: media_player.kitchen_speaker
#
#    or run it from the UI and pick the speaker from the dropdown.

# ---------- configuration.yaml ----------

rest_command:
  ma_recent_audiobooks:
    url: "{{ url }}/api"
    method: POST
    headers:
      Authorization: "{{ auth }}"
      Content-Type: application/json
    payload: >-
      {
        "message_id": "play_recent_audible_audiobook",
        "command": "music/audiobooks/library_items",
        "args": {
          "limit": 50,
          "order_by": "last_played_desc"
        }
      }
    content_type: application/json
    timeout: 15

# ---------- scripts.yaml ----------

play_recent_audible_audiobook:
  alias: Play current Audible audiobook
  description: >-
    Resume the Audible audiobook you most recently listened to on the
    selected Music Assistant speaker.
  icon: mdi:book-play
  mode: single
  fields:
    media_player:
      name: Speaker
      description: Music Assistant media player to play on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: music_assistant
  sequence:
    - action: rest_command.ma_recent_audiobooks
      data:
        url: !secret music_assistant_url
        auth: !secret music_assistant_auth
      response_variable: ma_response
    - variables:
        audiobooks: >-
          {{ ma_response.content
             if ma_response is mapping
                and ma_response.content is iterable
                and ma_response.content is not string
             else [] }}
        media_uri: >-
          {%- set ns = namespace(item_id=none) -%}
          {%- for book in audiobooks if ns.item_id is none -%}
            {%- for pm in (book.provider_mappings or []) if ns.item_id is none -%}
              {%- if pm.provider_domain == 'audible' and pm.available -%}
                {%- set ns.item_id = book.item_id -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- if ns.item_id -%}library://audiobook/{{ ns.item_id }}{%- endif -%}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ media_uri | length > 0 }}"
          sequence:
            - action: music_assistant.play_media
              target:
                entity_id: "{{ media_player }}"
              data:
                media_id: "{{ media_uri }}"
                media_type: audiobook
                enqueue: replace
      default:
        - action: persistent_notification.create
          data:
            title: Audible playback
            message: >-
              No Audible audiobooks were found in your Music Assistant
              library. Make sure the Audible provider is configured and
              has finished syncing.
